name: Build and Push Docker Image

on:
  push:
    branches:
      - main        # triggers on push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # 3. Add QEMU for multi-platform emulation (REQUIRED)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Docker Buildx (enables advanced builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container # This ensures parallel multi-arch builds

      - name: Build and push image to Docker Hub
        id: build-push-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pi-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pi-dashboard:${{ github.sha }}

      - name: Checkout k3s homelab repository
        uses: actions/checkout@v4
        with:
          repository: Quangsumi/k3s-homelab
          token: ${{ secrets.K3S_HOMELAB_REPO_TOKEN }}
          path: k3s-homelab

      - name: Update pi-dashboard image
        shell: bash
        env:
          IMAGE: quangsumi/pi-dashboard:${{ github.sha }}@${{ steps.build-push-image.outputs.digest }}
        run: |
          FILE="/k3s-homelab/apps/pi-dashboard/00-pi-dashboard.yaml"

          sed -i -E \
            "s#^([[:space:]]*)image: quangsumi/pi-dashboard:.*#\1image: ${IMAGE}#" \
            "$FILE"

          grep -F "image: ${IMAGE}" "$FILE"

      - name: Commit image update
        shell: bash
        run: |
          cd k3s-homelab

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/pi-dashboard/00-pi-dashboard.yaml

          if git diff --cached --quiet; then
            echo "Image reference is already current"
            exit 0
          fi

          git commit -m "deploy(pi-dashboard): ${GITHUB_SHA}"
          git push origin HEAD:main
