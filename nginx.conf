server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html/codes;
    index index.html;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        autoindex on;
        autoindex_format json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}