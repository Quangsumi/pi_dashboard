<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>chillin' in my house</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <div id="container">
    <div id="left" class="panel">
      <div id="category-filters"></div>
      <p id="quote"></p>
      <div id="quote-dots"></div>
    </div>

    <div id="center" class="panel">
      <div id="hanoi-clock"></div>
      <img id="randomImage" class="center-img active" alt="Random content" />
      <img id="randomImageNext" class="center-img" alt="Next content" />
      <video id="randomVideo" class="center-img" autoplay loop muted playsinline></video>
      <button id="nextArrow"><span>next</span> ›</button>
      <button id="themeShuffleBtn" title="Random theme">◐</button>
      <button id="dimBtn" title="Dim display">◑</button>
    </div>

    <div id="right" class="panel">
      <div id="right-label">World Clocks</div>
      <div id="clocks"></div>
    </div>
  </div>

  <div id="dim-overlay"></div>
  <script src="script.js"></script>
</body>
</html>
